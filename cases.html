<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Кейсы и отзывы — Гузель Усманова</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Unbounded:wght@400;600;700;800;900&family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
  :root{
    --void:#0a0910;
    --panel:#141019;
    --panel-2:#191320;
    --pink:#e8578d;
    --pink-bright:#ff7aad;
    --pink-dim:#7a2f4c;
    --ink:#f7f2f4;
    --muted:#a89aa4;
    --line:#2b2331;
  }
  *{margin:0;padding:0;box-sizing:border-box;}
  html{scroll-behavior:smooth;}
  body{
    background:var(--void);
    color:var(--ink);
    font-family:'Manrope',sans-serif;
    font-weight:500;
    overflow-x:hidden;
  }
  h1,h2,h3,.display{
    font-family:'Unbounded',sans-serif;
    font-weight:800;
    letter-spacing:-0.01em;
    line-height:0.98;
    text-transform:uppercase;
  }
  a{color:inherit;text-decoration:none;}
  img{display:block;max-width:100%;}
  .wrap{max-width:1180px;margin:0 auto;padding:0 32px;}
  .eyebrow{
    font-family:'Manrope',sans-serif;
    font-weight:800;
    font-size:12px;
    letter-spacing:0.22em;
    text-transform:uppercase;
    color:var(--pink);
  }

  /* ===== NAV ===== */
  nav{
    position:fixed;top:0;left:0;right:0;z-index:100;
    display:flex;align-items:center;justify-content:space-between;
    padding:22px 40px;
    background:linear-gradient(to bottom, rgba(10,9,16,0.85), transparent);
    backdrop-filter:blur(2px);
  }
  .logo{font-family:'Unbounded',sans-serif;font-weight:700;font-size:18px;letter-spacing:0.02em;}
  .logo span{color:var(--pink);}
  .nav-links{display:flex;gap:34px;font-size:13px;letter-spacing:0.06em;text-transform:uppercase;font-weight:700;}
  .nav-links a{opacity:0.8;transition:opacity .2s, color .2s;}
  .nav-links a:hover{opacity:1;color:var(--pink-bright);}
  .btn{
    display:inline-flex;align-items:center;gap:10px;
    background:var(--pink);
    color:#180810;
    font-weight:800;
    font-size:13px;
    letter-spacing:0.04em;
    text-transform:uppercase;
    padding:15px 28px;
    border-radius:999px;
    border:none;
    cursor:pointer;
    transition:transform .25s ease, background .25s ease, box-shadow .25s ease;
    box-shadow:0 8px 24px -8px rgba(232,87,141,0.6);
  }
  .btn:hover{background:var(--pink-bright);transform:translateY(-2px);}
  .btn-ghost{
    background:transparent;
    border:1.5px solid var(--line);
    color:var(--ink);
    box-shadow:none;
  }
  .btn-ghost:hover{border-color:var(--pink);color:var(--pink-bright);background:transparent;}
  .nav-cta{display:none;}
  @media(min-width:860px){.nav-cta{display:inline-flex;}}

  /* ===== HERO ===== */
  .hero{
    position:relative;
    display:flex;flex-direction:column;
    background:#050409;
  }
  .hero-photo{
    position:relative;
    width:100%;
    aspect-ratio:1122/1402;
    overflow:hidden;
  }
  .hero-photo img{
    width:100%;height:100%;object-fit:cover;
    object-position:50% 50%;
  }
  .hero-bottom{display:flex;flex-direction:column;}
  .hero-stats{
    display:flex;gap:32px;flex-wrap:wrap;
    padding:22px 24px;
    background:var(--panel);
    border-top:1px solid var(--line);
  }
  .stat-num{
    font-family:'Unbounded';font-weight:800;
    font-size:26px;color:var(--pink-bright);
    display:block;
    font-variant-numeric:tabular-nums;
  }
  .stat-label{font-size:12px;color:var(--muted);letter-spacing:0.03em;max-width:170px;line-height:1.3;margin-top:4px;}
  .hero-actions{
    display:flex;flex-wrap:wrap;gap:14px;
    padding:28px 24px 34px;
    background:var(--void);
  }
  @media(min-width:900px){
    .hero{
      display:block;
      min-height:100svh;
      overflow:hidden;
    }
    .hero-photo{
      position:absolute;inset:0;
      width:100%;height:100%;
      aspect-ratio:auto;
    }
    .hero-photo img{object-position:50% 22%;}
    .hero::after{
      content:"";position:absolute;inset:0;
      background:linear-gradient(0deg, rgba(6,5,10,0.92) 0%, rgba(6,5,10,0.15) 32%, transparent 55%);
      pointer-events:none;
    }
    .hero-bottom{
      position:absolute;left:0;right:0;bottom:0;z-index:2;
      padding:0 56px 76px;
      gap:26px;
    }
    .hero-stats{
      align-self:flex-start;
      background:rgba(10,9,16,0.5);
      backdrop-filter:blur(10px);
      border:1px solid rgba(255,255,255,0.1);
      border-radius:16px;
      padding:18px 28px;
      gap:38px;
    }
    .hero-actions{background:none;padding:0;}
  }

  @media(prefers-reduced-motion:no-preference){
    @keyframes heroPhotoIn{from{opacity:0;transform:scale(1.06);}to{opacity:1;transform:scale(1);}}
    @keyframes heroBottomIn{from{opacity:0;transform:translateY(18px);}to{opacity:1;transform:translateY(0);}}
    .hero-photo img{animation:heroPhotoIn 1.1s cubic-bezier(.16,.84,.44,1) both;}
    .hero-bottom{animation:heroBottomIn .9s cubic-bezier(.16,.84,.44,1) .3s both;}
  }

  /* ===== SCROLL REVEAL ===== */
  .reveal{
    opacity:0;transform:translateY(26px);
    transition:opacity .7s cubic-bezier(.16,.84,.44,1), transform .7s cubic-bezier(.16,.84,.44,1);
  }
  .reveal.in-view{opacity:1;transform:none;}
  .whofor-item.reveal:nth-child(1),.acc-item.reveal:nth-child(1),.price-card.reveal:nth-child(1){transition-delay:0s;}
  .whofor-item.reveal:nth-child(2),.acc-item.reveal:nth-child(2),.price-card.reveal:nth-child(2){transition-delay:.08s;}
  .whofor-item.reveal:nth-child(3),.acc-item.reveal:nth-child(3),.price-card.reveal:nth-child(3){transition-delay:.16s;}
  .whofor-item.reveal:nth-child(4),.acc-item.reveal:nth-child(4){transition-delay:.24s;}
  .whofor-item.reveal:nth-child(5),.acc-item.reveal:nth-child(5){transition-delay:.32s;}
  .acc-item.reveal:nth-child(6){transition-delay:.4s;}
  .acc-item.reveal:nth-child(7){transition-delay:.48s;}
  .acc-item.reveal:nth-child(8){transition-delay:.56s;}
  .acc-item.reveal:nth-child(9){transition-delay:.64s;}
  @media(prefers-reduced-motion:reduce){
    .reveal{opacity:1;transform:none;transition:none;}
  }

  /* ===== SECTION SCAFFOLD ===== */
  section{position:relative;padding:110px 0;}
  .section-head{max-width:680px;margin-bottom:56px;}
  .section-title{font-size:clamp(32px,4.4vw,50px);margin-top:14px;color:var(--ink);}
  .section-title .hl{color:var(--pink);}

  /* ===== ABOUT BLOCKS ===== */
  .about{background:var(--panel);}
  .about-lead{
    font-size:clamp(20px,2.4vw,26px);
    font-weight:700;
    line-height:1.5;
    max-width:820px;
    color:var(--ink);
    margin-bottom:70px;
  }
  .about-lead b{color:var(--pink-bright);}
  .about-grid{
    display:grid;grid-template-columns:1fr;gap:0;
    border-top:1px solid var(--line);
  }
  @media(min-width:800px){.about-grid{grid-template-columns:220px 1fr;}}
  .about-row{
    display:grid;grid-template-columns:1fr;gap:14px;
    padding:38px 0;border-bottom:1px solid var(--line);
  }
  @media(min-width:800px){.about-row{grid-template-columns:220px 1fr;gap:40px;}}
  .about-row .eyebrow{padding-top:4px;}
  .about-row p{color:var(--muted);font-size:16px;line-height:1.75;max-width:640px;}
  .about-row p + p{margin-top:16px;}
  .about-row strong{color:var(--ink);}

  /* ===== PORTRAIT FEATURE ===== */
  .feature{
    background:var(--void);
    position:relative;
  }
  .feature-grid{
    display:grid;grid-template-columns:1fr;gap:0;
    align-items:stretch;
  }
  @media(min-width:860px){.feature-grid{grid-template-columns:0.85fr 1.15fr;}}
  .feature-photo{
    position:relative;
    min-height:440px;
    overflow:hidden;
    background:#050409;
  }
  .feature-photo img{
    width:100%;height:100%;object-fit:cover;object-position:50% 15%;
  }
  .feature-photo::after{
    content:"";position:absolute;inset:0;
    background:linear-gradient(90deg, transparent 60%, var(--void) 100%);
  }
  @media(max-width:859px){.feature-photo::after{background:linear-gradient(0deg, var(--void) 0%, transparent 30%);}}
  .feature-copy{
    display:flex;flex-direction:column;justify-content:center;
    gap:22px;
    padding:56px 32px;
  }
  @media(min-width:860px){.feature-copy{padding:0 32px 0 64px;}}
  .feature-copy blockquote{
    font-family:'Unbounded';font-weight:700;
    font-size:clamp(24px,3.6vw,38px);line-height:1.3;
    color:var(--ink);max-width:560px;
  }
  .feature-copy blockquote .hl{color:var(--pink);}
  .feature-copy cite{
    font-style:normal;color:var(--muted);font-size:14px;letter-spacing:0.04em;
  }

  /* ===== WHO FOR — pull quote strip ===== */
  .whofor{background:var(--void);}
  .whofor-list{display:grid;gap:0;border-top:1px solid var(--line);}
  .whofor-item{
    padding:28px 0;border-bottom:1px solid var(--line);
    display:grid;grid-template-columns:24px 1fr;gap:20px;
  }
  .whofor-item .mark{color:var(--pink);font-family:'Unbounded';font-weight:800;font-size:20px;}
  .whofor-item p{color:var(--ink);font-size:17px;line-height:1.6;font-weight:600;max-width:720px;}

  /* ===== FAQ / ACCORDION ("с чем можно прийти") ===== */
  .help{background:var(--panel);}
  .acc{border-top:1px solid var(--line);}
  .acc-item{border-bottom:1px solid var(--line);}
  .acc-q{
    width:100%;text-align:left;background:none;border:none;cursor:pointer;
    display:flex;align-items:center;justify-content:space-between;gap:24px;
    padding:26px 4px;color:var(--ink);
    font-family:'Unbounded';font-weight:700;font-size:clamp(16px,2vw,20px);
    text-transform:none;
  }
  .acc-q .plus{
    flex:none;width:30px;height:30px;border-radius:50%;
    border:1.5px solid var(--line);display:flex;align-items:center;justify-content:center;
    font-size:18px;color:var(--pink);transition:transform .3s ease, border-color .3s;
  }
  .acc-item.open .plus{transform:rotate(45deg);border-color:var(--pink);}
  .acc-a{
    max-height:0;overflow:hidden;transition:max-height .38s ease;
  }
  .acc-a p{color:var(--muted);font-size:15.5px;line-height:1.7;padding:0 4px 26px;max-width:680px;}

  /* ===== METHOD ===== */
  .method{background:var(--void);}
  .method-flow{
    display:flex;flex-wrap:wrap;align-items:center;gap:14px;
    font-family:'Unbounded';font-weight:700;font-size:clamp(15px,2vw,19px);
    color:var(--muted);margin-bottom:56px;
  }
  .method-flow span{color:var(--ink);}
  .method-flow .arrow{color:var(--pink);font-weight:400;}
  .method-cols{display:grid;grid-template-columns:1fr;gap:44px;}
  @media(min-width:800px){.method-cols{grid-template-columns:1fr 1fr;}}
  .method-cols p{color:var(--muted);font-size:16px;line-height:1.75;}
  .method-cols p+p{margin-top:16px;}
  .method-quote{
    margin-top:70px;padding-top:50px;border-top:1px solid var(--line);
    font-family:'Unbounded';font-weight:700;
    font-size:clamp(22px,3.4vw,36px);line-height:1.35;max-width:840px;color:var(--ink);
  }
  .method-quote .hl{color:var(--pink);}

  /* ===== PRICING ===== */
  .pricing{background:var(--panel);}
  .price-grid{display:grid;grid-template-columns:1fr;gap:24px;}
  @media(min-width:760px){.price-grid{grid-template-columns:repeat(2,1fr);}}
  .price-card{
    background:var(--panel-2);
    border:1px solid var(--line);
    border-radius:22px;
    padding:36px 30px;
    display:flex;flex-direction:column;
    transition:border-color .25s, transform .25s;
  }
  .price-card:hover{border-color:var(--pink-dim);transform:translateY(-4px);}
  .price-card.featured{
    border-color:var(--pink);
    background:linear-gradient(180deg, rgba(232,87,141,0.14), var(--panel-2) 40%);
    position:relative;
  }
  .price-tag{
    align-self:flex-start;
    font-size:11px;font-weight:800;letter-spacing:0.12em;text-transform:uppercase;
    color:var(--pink-bright);border:1px solid var(--pink-dim);border-radius:999px;
    padding:6px 14px;margin-bottom:22px;
  }
  .price-name{font-family:'Unbounded';font-weight:700;font-size:22px;margin-bottom:10px;color:var(--ink);}
  .price-value{font-family:'Unbounded';font-weight:800;font-size:30px;color:var(--pink-bright);margin-bottom:18px;}
  .price-desc{color:var(--muted);font-size:14.5px;line-height:1.65;margin-bottom:22px;}
  .price-list{list-style:none;margin-bottom:28px;flex:1;}
  .price-list li{
    font-size:14.5px;color:var(--ink);opacity:0.85;
    padding:9px 0;border-top:1px solid var(--line);
    display:flex;gap:10px;
  }
  .price-list li::before{content:"—";color:var(--pink);flex:none;}
  .price-card .btn{width:100%;justify-content:center;}

  /* ===== CASES TEASER ===== */
  .cases{background:var(--panel);}
  .cases-grid{display:grid;grid-template-columns:1fr;gap:22px;margin-bottom:48px;}
  @media(min-width:700px){.cases-grid{grid-template-columns:repeat(2,1fr);}}
  .case-card{
    display:block;border-radius:18px;overflow:hidden;
    border:1px solid var(--line);
    transition:transform .3s, border-color .3s;
  }
  .case-card:hover{transform:translateY(-6px);border-color:var(--pink-dim);}
  .case-card img{width:100%;display:block;}
  .cases-cta{text-align:center;}

  /* ===== FINAL CTA ===== */
  .final{
    background:var(--void);
    padding:130px 0;
    text-align:center;
    position:relative;
    overflow:hidden;
  }
  .final::before{
    content:"";position:absolute;left:50%;top:50%;width:900px;height:900px;
    background:radial-gradient(circle, rgba(232,87,141,0.16), transparent 65%);
    transform:translate(-50%,-50%);
  }
  .final h2{font-size:clamp(36px,6vw,68px);position:relative;max-width:820px;margin:0 auto 30px;}
  .final h2 .hl{color:var(--pink);}
  .final p{color:var(--muted);font-size:17px;max-width:520px;margin:0 auto 40px;position:relative;}
  .final .btn{position:relative;padding:20px 44px;font-size:14px;}

  footer{
    background:var(--void);border-top:1px solid var(--line);
    padding:40px 0;
  }
  .foot-row{display:flex;flex-wrap:wrap;justify-content:space-between;gap:20px;align-items:center;}
  .foot-row .logo{font-size:16px;}
  .foot-links{display:flex;gap:24px;font-size:13px;color:var(--muted);}
  .foot-links a:hover{color:var(--pink-bright);}
  .foot-copy{font-size:12.5px;color:var(--muted);opacity:0.7;}
</style>
<style>
  .cases-hero{
    padding:150px 24px 60px;
    background:var(--void);
    text-align:center;
  }
  .cases-hero .eyebrow{display:block;margin-bottom:16px;}
  .cases-hero h1{
    font-size:clamp(30px,5vw,52px);
    max-width:780px;margin:0 auto 20px;
    font-family:'Unbounded',sans-serif;font-weight:800;
    text-transform:uppercase;color:var(--ink);line-height:1.1;
  }
  .cases-hero h1 .hl{color:var(--pink);}
  .cases-hero p{color:var(--muted);max-width:560px;margin:0 auto;font-size:16px;line-height:1.6;}
  .gallery{background:var(--panel);padding:80px 0 120px;}
  .gallery-grid{display:grid;grid-template-columns:1fr;gap:32px;}
  @media(min-width:700px){.gallery-grid{grid-template-columns:repeat(2,1fr);}}
  .gallery-item{
    border-radius:20px;overflow:hidden;
    border:1px solid var(--line);
    background:var(--panel-2);
  }
  .gallery-item img{width:100%;display:block;}
  .gallery-item.wide{grid-column:1 / -1;max-width:640px;margin:0 auto;}
  .back-link{
    display:inline-flex;align-items:center;gap:8px;
    color:var(--muted);font-size:14px;margin-bottom:8px;
  }
  .back-link:hover{color:var(--pink-bright);}
</style>
<body>
<nav>
  <div class="logo">Guzel <span>Usmanova</span></div>
  <div class="nav-links" style="display:none;" id="navLinksDesktop"></div>
  <a href="index.html#format" class="btn nav-cta">Начать</a>
</nav>

<header class="cases-hero">
  <span class="eyebrow">Кейсы и отзывы</span>
  <h1>Результаты учениц и <span class="hl">клиентов</span></h1>
  <p><a href="index.html" class="back-link">← Назад на главную</a></p>
</header>

<section class="gallery">
  <div class="wrap">
    <div class="gallery-grid">
      <div class="gallery-item wide"><img src="assets/cases/case-3.webp" alt="Кейс клиента — рост выручки за 3 месяца"></div>
      <div class="gallery-item"><img src="assets/cases/case-2.webp" alt="Отзыв клиента — Instagram стал каналом продаж"></div>
      <div class="gallery-item"><img src="assets/cases/case-1.webp" alt="В практикум зашёл крупный блогер"></div>
      <div class="gallery-item"><img src="assets/cases/case-4.webp" alt="Ещё отзывы и комментарии"></div>
      <div class="gallery-item"><img src="assets/cases/case-5.webp" alt="Комментарии подписчиков"></div>
    </div>
  </div>
</section>

<section class="final">
  <div class="wrap">
    <h2>Хочешь <span class="hl">такой же</span> результат?</h2>
    <p>Выбери формат работы, который подходит именно тебе.</p>
    <a href="index.html#format" class="btn">Смотреть форматы работы</a>
  </div>
</section>

<footer>
  <div class="wrap foot-row">
    <div class="logo">Guzel <span>Usmanova</span></div>
    <div class="foot-links">
      <a href="index.html#about">Обо мне</a>
      <a href="index.html#format">Форматы работы</a>
    </div>
    <div class="foot-copy">© 2026 Гузель Усманова</div>
  </div>
</footer>

</body>
</html>
